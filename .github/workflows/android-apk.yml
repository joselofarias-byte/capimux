name: Capimux Android APK
on:
  push:
    branches: [feat/capimux-android-apk]
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build embedded dashboard
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install emulator native toolchain
        run: sdkmanager 'ndk;28.0.13004108'
      - name: Build Android native engines
        run: bash android/ci/build-engine.sh
      - name: Test APK SQLite adapter on host
        run: go test -tags=capimux_apk ./internal/db/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and test Android package
        run: gradle -p android :app:assembleHonorDebug :app:assembleEmulatorDebug :app:testHonorDebugUnitTest :app:lintHonorDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 lifecycle smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android/ci/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Capimux-Android-debug
          path: |
            android/app/build/outputs/apk/honor/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-honorDebug.html
          retention-days: 14
