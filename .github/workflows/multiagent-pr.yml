name: Capimux Multiagent PR Validation
# Re-enabled fork Actions: retrigger validation on the feature branch.

on:
  workflow_dispatch:
  push:
    branches: [feat/capimux-multiagent-v04]
  pull_request:
    branches: [main]
    paths:
      - 'internal/multiagent/**'
      - 'internal/handlers/router.go'
      - 'internal/middleware/dashboard_auth.go'
      - 'internal/integration/multiagent_test.go'
      - 'web/src/api/**'
      - 'web/src/components/MultiagentView.svelte'
      - 'web/src/components/Sidebar.svelte'
      - 'web/src/App.svelte'
      - 'web/src/lib/router.ts'
      - '.github/workflows/multiagent-pr.yml'

permissions:
  contents: read

jobs:
  multiagent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck and build dashboard
        working-directory: web
        run: bun run build
      - name: Test dashboard
        working-directory: web
        run: bun test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Review Go formatting
        run: gofmt -d internal/multiagent/*.go internal/integration/multiagent_test.go
      - name: Test multiagent with race detector
        run: go test -race -count=1 ./internal/multiagent/ -v
      - name: Compile full Go server
        run: go build ./cmd/9router-go/
      - name: Test Go suite
        run: go test ./...

