name: Upstream provider sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "9router-provider-sync"
          git config user.email "9router-provider-sync@users.noreply.github.com"

      - name: Reconcile provider additions
        id: sync
        env:
          PROVIDER_SYNC_REPORT: /tmp/9router-provider-sync-report.md
        run: |
          set +e
          bash scripts/sync-upstream-providers.sh --apply
          rc=$?
          set -e

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "## Provider sync"
            echo
            cat /tmp/9router-provider-sync-report.md
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 42 ]; then
            exit "$rc"
          fi

      - name: Stop for manual reconciliation
        if: steps.sync.outputs.rc == '42'
        run: |
          echo "Provider sync needs manual reconciliation; see the workflow summary." >&2
          exit 1

      - name: Push provider sync branch
        if: steps.sync.outputs.rc == '0'
        id: push
        env:
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet "origin/$BASE_BRANCH...HEAD"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="bot/upstream-provider-sync"
          git branch -f "$branch" HEAD
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh provider sync PR
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          BOT_BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          title="chore: sync new providers from upstream"
          existing="$(gh pr list --state open --head "$BOT_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$BOT_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "$title" \
              --body "Automated provider-only upstream reconciliation. Provider additions are cherry-picked as complete upstream commits, CI remains mandatory, and this workflow never auto-merges."
          else
            gh pr edit "$existing" --title "$title"
          fi
